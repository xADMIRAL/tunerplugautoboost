name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
      - name: Check plugin manifest
        run: |
          unzip -p boost-autotune-plugin/target/BoostAutotune.jar META-INF/MANIFEST.MF | grep -q "ApplicationPlugin: io.github.xadmiral.boostautotune.plugin.BoostAutotunePlugin"
          if unzip -l boost-autotune-plugin/target/BoostAutotune.jar | grep -q efiAnalytics; then echo "API classes must not be bundled"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: BoostAutotune.jar
          path: boost-autotune-plugin/target/BoostAutotune.jar
